<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Preview — Portfolia</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/preview.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23B7A5D6'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='18' font-family='Georgia,serif' fill='white' font-weight='bold'%3EP%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <!-- Preview toolbar (editor mode indicator) -->
  <div class="preview-page-bar" id="previewBar">
    <div class="preview-bar-left">
      <a href="index.html" class="preview-bar-logo">Portfolia<span>.</span></a>
      <span class="preview-bar-label">Preview Mode</span>
    </div>
    <div class="preview-bar-right">
      <a href="editor.html" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,0.3);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Back to Editor
      </a>
      <button class="btn btn-primary btn-sm" id="exportFromPreview">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Export HTML
      </button>
    </div>
  </div>

  <!-- Portfolio content rendered here -->
  <div class="preview-content">
    <div id="portfolioContent">
      <!-- Loading state -->
      <div id="loadingState" style="display:flex;align-items:center;justify-content:center;min-height:80vh;flex-direction:column;gap:1rem;color:var(--text-muted);">
        <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--lavender);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p>Loading your portfolio...</p>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/export.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const data = PortfoliaStorage.load();
      const content = document.getElementById('portfolioContent');

      if (content && window.PortfoliaPreview) {
        window.PortfoliaPreview.render(data, content);
      }

      // Export button on preview page
      document.getElementById('exportFromPreview')?.addEventListener('click', () => {
        if (window.PortfoliaExport) {
          window.PortfoliaExport.exportHTML(data);
        }
      });
    });
  </script>
</body>
</html>
